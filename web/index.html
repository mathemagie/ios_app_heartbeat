<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Heart Nebula — Live</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heart Nebula">
  <script src="https://js.pusher.com/8.4.0-rc2/pusher.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background: black;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The nebula image that breathes in time with the heartbeat */
    .nebula {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: url('nebu.jpg') no-repeat center center / cover;
      animation: pulse 1s ease-in-out infinite;
      /* Smoothly ease between heart rates when the BPM changes */
      transition: animation-duration 1.2s cubic-bezier(0.37, 0, 0.63, 1);
      will-change: filter, transform;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .nebula { animation: none; }
    }

    /* BPM read-out overlaid on the nebula */
    .hud {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
    }

    .hud .bpm {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      display: inline-block;
      transform-origin: center bottom;
      /* Law 7: the number beats in time with the nebula (lub-dub). */
      animation: beat 1s ease-in-out infinite;
      will-change: transform;
    }

    .hud .bpm.idle { opacity: 0.4; }

    /* Law 7 EMOTION: a strong "lub" then softer "dub", synced to the BPM. */
    @keyframes beat {
      0%        { transform: scale(1); }
      12%       { transform: scale(1.09); }
      28%       { transform: scale(1.00); }
      40%       { transform: scale(1.04); }
      55%, 100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud .bpm { animation: none; }
    }

    /* Law 6: demote the unit to a quiet caption so the number dominates. */
    .hud .unit {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      opacity: 0.55;
      margin-top: 6px;
    }

    .hud .meta {
      font-size: 12px;
      opacity: 0.55;
      margin-top: 8px;
    }

    /* Connection dot, top-right. Law 1: recedes once connected. */
    .status {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      right: calc(18px + env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      z-index: 10;
      transition: opacity 1.2s ease;
    }

    .status.hidden { opacity: 0; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .dot.connected { background: #34c759; box-shadow: 0 0 8px #34c759; }

    /* Law 4: a quiet self-explaining mark, top-left. Recedes after a moment. */
    .mark {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: calc(20px + env(safe-area-inset-left));
      z-index: 10;
      color: #fff;
      max-width: 62vw;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
      transition: opacity 1.5s ease;
    }

    .mark .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .mark .sub {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 2px;
    }

    .mark.recede { opacity: 0.22; }

    /* The breathing animation: a strong "lub", softer "dub", then rest.
       Values come from CSS variables set per-keyframe in JavaScript. */
    @keyframes pulse {
      0%   { filter: brightness(var(--b-0))   saturate(var(--s-0))   hue-rotate(var(--h-0));   transform: scale(var(--c-0)); }
      6%   { filter: brightness(var(--b-6))   saturate(var(--s-6))   hue-rotate(var(--h-6));   transform: scale(var(--c-6)); }
      12%  { filter: brightness(var(--b-12))  saturate(var(--s-12))  hue-rotate(var(--h-12));  transform: scale(var(--c-12)); }
      18%  { filter: brightness(var(--b-18))  saturate(var(--s-18))  hue-rotate(var(--h-18));  transform: scale(var(--c-18)); }
      25%  { filter: brightness(var(--b-25))  saturate(var(--s-25))  hue-rotate(var(--h-25));  transform: scale(var(--c-25)); }
      33%  { filter: brightness(var(--b-33))  saturate(var(--s-33))  hue-rotate(var(--h-33));  transform: scale(var(--c-33)); }
      42%  { filter: brightness(var(--b-42))  saturate(var(--s-42))  hue-rotate(var(--h-42));  transform: scale(var(--c-42)); }
      50%  { filter: brightness(var(--b-50))  saturate(var(--s-50))  hue-rotate(var(--h-50));  transform: scale(var(--c-50)); }
      58%  { filter: brightness(var(--b-58))  saturate(var(--s-58))  hue-rotate(var(--h-58));  transform: scale(var(--c-58)); }
      67%  { filter: brightness(var(--b-67))  saturate(var(--s-67))  hue-rotate(var(--h-67));  transform: scale(var(--c-67)); }
      75%  { filter: brightness(var(--b-75))  saturate(var(--s-75))  hue-rotate(var(--h-75));  transform: scale(var(--c-75)); }
      83%  { filter: brightness(var(--b-83))  saturate(var(--s-83))  hue-rotate(var(--h-83));  transform: scale(var(--c-83)); }
      91%  { filter: brightness(var(--b-91))  saturate(var(--s-91))  hue-rotate(var(--h-91));  transform: scale(var(--c-91)); }
      100% { filter: brightness(var(--b-100)) saturate(var(--s-100)) hue-rotate(var(--h-100)); transform: scale(var(--c-100)); }
    }
  </style>
</head>
<body>
  <div class="nebula" id="nebula"></div>

  <div class="mark" id="mark">
    <div class="title">Heart Nebula</div>
    <div class="sub">IC 1805 · beating at a live heart rate</div>
  </div>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">connecting…</span>
  </div>

  <div class="hud">
    <div class="bpm idle" id="bpm">--</div>
    <div class="unit">BPM</div>
    <div class="meta" id="meta">Waiting for a heartbeat…</div>
  </div>

  <script>
    // Single global stream — same public channel the iOS app publishes to.
    const SHARE_ID = "live";

    const nebula = document.getElementById("nebula");
    const bpmEl = document.getElementById("bpm");
    const metaEl = document.getElementById("meta");
    const dotEl = document.getElementById("dot");
    const statusEl = document.getElementById("status-text");
    const statusBox = document.getElementById("status");
    const mark = document.getElementById("mark");

    // Build the per-keyframe breathing curve once. A strong systolic "lub"
    // and softer "dub" peak, plus a faint baseline tremor during the rest.
    function buildPulseCurve() {
      const root = document.documentElement.style;
      const intensity = 1.5, maxSat = 1.5, maxHue = 6, maxScale = 1.016;
      const minBright = Math.max(0.6, intensity - 0.4), minSat = 0.9, minScale = 1.0;
      const keyframes = [0, 6, 12, 18, 25, 33, 42, 50, 58, 67, 75, 83, 91, 100];
      const lubCenter = 14, lubWidth = 9, dubCenter = 34, dubWidth = 11, dubAmp = 0.6;

      keyframes.forEach(p => {
        const lub = Math.exp(-Math.pow((p - lubCenter) / lubWidth, 2));
        const dub = dubAmp * Math.exp(-Math.pow((p - dubCenter) / dubWidth, 2));
        const baseline = 0.04 * (Math.sin((p / 100) * 2 * Math.PI * 1.7) + 1) / 2;
        const f = Math.max(0, Math.min(1, lub + dub + baseline));
        root.setProperty(`--b-${p}`, (minBright + (intensity - minBright) * f).toFixed(3));
        root.setProperty(`--s-${p}`, (minSat + (maxSat - minSat) * f).toFixed(3));
        root.setProperty(`--h-${p}`, (maxHue * f).toFixed(2) + "deg");
        root.setProperty(`--c-${p}`, (minScale + (maxScale - minScale) * f).toFixed(5));
      });
    }

    // Map a heart rate to one breathing cycle: one beat per cycle.
    // The nebula AND the BPM number share the same period, so they beat as one.
    function setHeartRate(bpm) {
      const clamped = Math.max(30, Math.min(220, bpm));
      const period = (60 / clamped).toFixed(3) + "s";
      nebula.style.animationDuration = period;
      bpmEl.style.animationDuration = period;
    }

    buildPulseCurve();

    // Law 4: let the intro mark recede after it has been read.
    setTimeout(() => mark.classList.add("recede"), 6000);

    // Publishable Pusher credentials (safe to expose — the SECRET is never here,
    // it lives only in the Vercel serverless function). Used as a fallback when
    // /api/config isn't available, e.g. on a plain localhost static server.
    const FALLBACK_CONFIG = { key: "3b88050d4007e937f6d7", cluster: "eu" };

    document.addEventListener("DOMContentLoaded", async () => {
      let config;
      try {
        config = await (await fetch("/api/config")).json();
        if (!config.key) throw new Error("missing key");
      } catch (e) {
        // No serverless API here (localhost) — use the public key directly.
        config = FALLBACK_CONFIG;
      }

      const pusher = new Pusher(config.key, { cluster: config.cluster });
      const channel = pusher.subscribe(`heartrate-${SHARE_ID}`);

      let hideTimer;
      pusher.connection.bind("state_change", (s) => {
        statusEl.textContent = s.current;
        const connected = s.current === "connected";
        dotEl.classList.toggle("connected", connected);
        // Law 1 (Hide) + Law 6: once connected, let the status recede;
        // bring it back the moment the connection is no longer healthy.
        clearTimeout(hideTimer);
        if (connected) {
          hideTimer = setTimeout(() => statusBox.classList.add("hidden"), 2500);
        } else {
          statusBox.classList.remove("hidden");
        }
      });

      channel.bind("heartrate-update", (data) => {
        const bpm = Number(data.bpm);
        if (!Number.isFinite(bpm)) return;
        setHeartRate(bpm);
        bpmEl.textContent = bpm;
        bpmEl.classList.remove("idle");
        const t = new Date(data.timestamp || Date.now()).toLocaleTimeString();
        metaEl.textContent = `${data.source || "unknown"} • ${t}`;
      });
    });
  </script>
</body>
</html>
