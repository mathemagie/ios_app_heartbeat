<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Rate Monitor - Live</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Animated background gradient */
      body::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: moveBackground 20s linear infinite;
        z-index: 0;
      }

      @keyframes moveBackground {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }

      .container {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 60px 40px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        color: white;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        margin-bottom: 40px;
        font-weight: 400;
      }

      /* Heart icon animation */
      .heart-icon {
        font-size: 3rem;
        margin-bottom: 30px;
        animation: heartbeat 1.5s ease-in-out infinite;
        display: inline-block;
      }

      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        10% { transform: scale(1.1); }
        20% { transform: scale(1); }
        30% { transform: scale(1.1); }
        40% { transform: scale(1); }
      }

      /* BPM Display */
      .bpm-container {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 40px 20px;
        margin: 30px 0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        position: relative;
        overflow: hidden;
      }

      .bpm-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
      }

      #bpm {
        font-size: 5rem;
        font-weight: 800;
        color: white;
        line-height: 1;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        letter-spacing: -2px;
        transition: all 0.3s ease;
      }

      #bpm.pulse {
        animation: bpmPulse 0.3s ease;
      }

      @keyframes bpmPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .bpm-label {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      /* Meta info */
      #meta {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        margin: 20px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      #meta::before {
        content: '📱';
        font-size: 1.2rem;
      }

      /* Status badge */
      #status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.9);
        margin: 20px 0;
        transition: all 0.3s ease;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #94a3b8;
        transition: all 0.3s ease;
      }

      .status-dot.connected {
        background: #4ade80;
        box-shadow: 0 0 10px #4ade80, 0 0 20px rgba(74, 222, 128, 0.5);
        animation: pulse-dot 2s infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      /* Share ID section */
      .share-section {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .share-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .share-id {
        display: inline-block;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        padding: 12px 24px;
        border-radius: 12px;
        font-family: 'Monaco', 'Courier New', monospace;
        font-size: 1.1rem;
        letter-spacing: 2px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .share-id:hover {
        background: rgba(0, 0, 0, 0.4);
        transform: translateY(-2px);
      }

      /* Waiting state */
      .waiting {
        color: rgba(255, 255, 255, 0.5);
        font-style: italic;
      }

      /* Responsive design */
      @media (max-width: 600px) {
        .container {
          padding: 40px 25px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .heart-icon {
          font-size: 2.5rem;
        }

        #bpm {
          font-size: 4rem;
        }

        .bpm-container {
          padding: 30px 15px;
        }
      }

      /* Loading animation */
      .loading-dots {
        display: inline-flex;
        gap: 4px;
      }

      .loading-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        animation: loading 1.4s infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes loading {
        0%, 80%, 100% {
          opacity: 0.3;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
    <script src="https://js.pusher.com/8.4.0-rc2/pusher.min.js"></script>
    <script src="nebula.js"></script>
    <script>
      // Single global stream — no per-user ID in the URL.
      const shareId = 'live'

      // Update UI elements
      document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('share-id').textContent = location.host

        // Fetch the *public* Pusher config (key + cluster) from the serverless
        // API. The secret stays in Vercel env vars and never reaches the browser.
        let config
        try {
          const res = await fetch('/api/config')
          config = await res.json()
          if (!config.key) throw new Error('missing key')
        } catch (error) {
          console.error('Failed to load Pusher config:', error)
          document.getElementById('bpm').textContent = 'Error'
          document.getElementById('meta').textContent = 'Config unavailable'
          return
        }

        // Initialize Pusher with the public key (no auth, no secret, no crypto)
        const pusher = new Pusher(config.key, { cluster: config.cluster })

        // Subscribe to the PUBLIC heart rate channel
        const channel = pusher.subscribe(`heartrate-${shareId}`)

        // Handle connection state
        pusher.connection.bind('state_change', (states) => {
          const statusDot = document.getElementById('status-dot')
          const statusText = document.getElementById('status-text')

          statusText.textContent = states.current
          statusDot.className = 'status-dot'

          if (states.current === 'connected') {
            statusDot.classList.add('connected')
          }
        })

        // Listen for heart rate updates
        channel.bind('heartrate-update', (data) => {
          const bpmElement = document.getElementById('bpm')
          bpmElement.textContent = data.bpm

          // Add pulse animation
          bpmElement.classList.remove('pulse')
          setTimeout(() => bpmElement.classList.add('pulse'), 10)

          // Format timestamp
          const timestamp = new Date(data.timestamp)
          const timeString = timestamp.toLocaleTimeString()

          document.getElementById('meta').textContent = Nebula.formatMeta(data.source, timeString)
        })

        // Handle subscription errors
        channel.bind('pusher:subscription_error', (error) => {
          console.error('Subscription error:', error)
          document.getElementById('bpm').textContent = 'Error'
          document.getElementById('meta').textContent = 'Failed to subscribe'
        })

        // Click to copy the stream URL
        document.getElementById('share-id').addEventListener('click', function() {
          navigator.clipboard.writeText(location.origin + '/').then(() => {
            const original = this.textContent
            this.textContent = '✓ Copied!'
            setTimeout(() => {
              this.textContent = original
            }, 2000)
          })
        })
      })
    </script>
  </head>
  <body>
    <div class="container">
      <div class="heart-icon">❤️</div>
      <h1>Heart Rate Monitor</h1>
      <p class="subtitle">Real-time health tracking</p>

      <div class="bpm-container">
        <div id="bpm" class="waiting">—</div>
        <div class="bpm-label">Beats per Minute</div>
      </div>

      <div id="meta" class="waiting">
        Waiting for data
        <span class="loading-dots">
          <span></span><span></span><span></span>
        </span>
      </div>

      <div id="status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>

      <div class="share-section">
        <div class="share-label">Live stream</div>
        <div class="share-id" id="share-id" title="Click to copy link"></div>
      </div>
    </div>
  </body>
</html>
